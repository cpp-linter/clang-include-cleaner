name: Test

# Builds one wheel on pull requests that change how the wheel is built, so a
# build failure shows up before a release instead of during it. publish.yml
# builds every platform when a version is tagged.

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'clang-include-cleaner_version.txt'
      - 'clang_include_cleaner/**'
      - 'test/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build and test a wheel (manylinux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheel
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_ARCHS: "x86_64"
          # The same settings as publish.yml: one Python version, because the
          # wheel does not depend on Python, and no tests inside the container.
          CIBW_BUILD: "cp311-manylinux*"
          CIBW_TEST_SKIP: "*linux*"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Test the wheel
        run: |
          # Remove the source package so the tests import the installed wheel.
          rm -r clang_include_cleaner
          python -m pip install wheelhouse/*.whl pytest
          python -m pytest
