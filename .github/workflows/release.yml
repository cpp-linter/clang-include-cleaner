name: Build + Release Wheels

on:
  push:
    tags:
      - 'v?[0-9]+.[0-9]+.[0-9]+'
      - 'v?[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM version to build"
        required: false
        default: ""
      wheel_version:
        description: "Version of the wheel packaging (appended to LLVM version)"
        required: false
        default: "0"
      deploy_to_testpypi:
        description: "Whether the build should be deployed to test.pypi.org instead of regular PyPI"
        required: true
        default: false

permissions: {}

jobs:
  build-wheels:
    name: "Build wheels on ${{ matrix.os }} :: platform=${{ matrix.platform }} arch=${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            platform: "manylinux"
            arch: "x86_64"
          - os: ubuntu-latest
            platform: "musllinux"
            arch: "x86_64"
          - os: ubuntu-latest
            platform: "manylinux"
            arch: "i686"
          - os: ubuntu-latest
            platform: "musllinux"
            arch: "i686"
          - os: ubuntu-24.04-arm
            platform: "manylinux"
            arch: "aarch64"
          - os: ubuntu-24.04-arm
            platform: "manylinux"
            arch: "armv7l"
          - os: ubuntu-24.04-arm
            platform: "musllinux"
            arch: "armv7l"
          # Windows
          - os: windows-latest
            platform: "win"
            arch: "AMD64"
          - os: windows-latest
            platform: "win"
            arch: "x86"
          # macOS
          - os: macos-15-intel
            platform: "macos"
            arch: "x86_64"
          - os: macos-latest
            platform: "macos"
            arch: "arm64"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Support long paths
      if: runner.os == 'Windows'
      run: git config --system core.longpaths true

    - name: Set up msvc on Windows
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ matrix.arch }}

    - name: Export macOS SDKROOT
      if: runner.os == 'macOS'
      run: echo SDKROOT=$(xcrun --sdk macosx --show-sdk-path) >> $GITHUB_ENV

    - name: Override LLVM version (${{ github.event.inputs.llvm_version }})
      if: github.event.inputs.llvm_version
      env:
        LLVM_VERSION: ${{ github.event.inputs.llvm_version }}
        WHEEL_VERSION: ${{ github.event.inputs.wheel_version }}
      run: |
        echo "${LLVM_VERSION}.${WHEEL_VERSION}" > clang-include-cleaner_version.txt
        cat clang-include-cleaner_version.txt

    - name: Build wheels
      uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
      env:
        CIBW_ARCHS: "${{ matrix.arch }}"
        CIBW_BEFORE_TEST: rm -rf {package}/clang_include_cleaner
        CIBW_TEST_SKIP: "*linux*"
        # always skip PyPY builds + what's defined in the matrix
        CIBW_SKIP: "pp* ${{matrix.skip}}"
        # restrict to a single Python version as wheel does not depend on Python:
        CIBW_BUILD: "cp311-${{ matrix.platform }}*"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: artifacts-wheels-${{ matrix.platform }}-${{ matrix.arch }}
        path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Override LLVM version (${{ github.event.inputs.llvm_version }})
        if: github.event.inputs.llvm_version
        env:
          LLVM_VERSION: ${{ github.event.inputs.llvm_version }}
          WHEEL_VERSION: ${{ github.event.inputs.wheel_version }}
        run: |
          echo "${LLVM_VERSION}.${WHEEL_VERSION}" > clang-include-cleaner_version.txt
          cat clang-include-cleaner_version.txt
      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.tar.gz
          name: artifacts-sdist

  test-sdist:
    name: Test build from source distribution
    needs: [build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        name: Install Python
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-sdist
          path: sdist

      - name: Install from SDist
        run: |
          rm -r clang_include_cleaner
          pip install sdist/*.tar.gz

      - name: Run test suite
        run: |
          python -m pip install pytest
          python -m pytest

  upload_pypi:
    name: Upload to PyPI
    needs: [build-wheels, build-sdist, test-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    if: github.repository_owner == 'cpp-linter'

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: (startsWith(github.event.ref, 'refs/tags/')) || (github.event.inputs.deploy_to_testpypi == 'false')

      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: github.event.inputs.deploy_to_testpypi == 'true'
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: GitHub release for tagged commits
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
